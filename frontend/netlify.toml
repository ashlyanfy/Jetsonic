[build]
  # Inject deploy timestamp into service worker cache name so cache busts on every deploy.
  command = "node -e \"const fs=require('fs');const v='jetsonic-pwa-v'+Date.now();let sw=fs.readFileSync('service-worker.js','utf8');sw=sw.replace(/jetsonic-pwa-v[^']+/,v);fs.writeFileSync('service-worker.js',sw);console.log('SW cache name:',v);\""
  publish = "."

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
