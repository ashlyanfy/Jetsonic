server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # HTML and the service worker must never be cached by browsers/proxies —
    # mirrors the Netlify headers so deploys are picked up immediately.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fingerprint-free static assets — long cache. styles.css is versioned by
    # deploy, images are immutable enough for a 30-day cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    location = /styles.css {
        add_header Cache-Control "public, max-age=86400";
    }

    # Слой аналитики правится чаще стилей, а расходится по всем страницам.
    # Час — компромисс: браузер не дёргает файл на каждый переход, но правка
    # контракта измерений доезжает до людей в тот же день, а не через сутки.
    location = /analytics.js {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Clean URLs: /about -> /about/index.html, /thank-you -> /thank-you.html.
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Serve the site's own styled 404 page with a real 404 status.
    error_page 404 /404.html;

    # Never let /api be answered by the static server — it is reverse-proxied
    # to the backend by Caddy on the same host, but block it here as a safety net.
    location /api/ {
        return 404;
    }
}
